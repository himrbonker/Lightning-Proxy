
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID PROXY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(100,100,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,100,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 1;
  }
  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 700px;
    padding: 2rem;
    text-align: center;
  }
  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    color: #fff;
    text-shadow: 0 0 20px rgba(120,80,255,0.8), 0 0 40px rgba(120,80,255,0.4);
    animation: flicker 4s infinite;
    margin-bottom: 0.3rem;
  }
  .tagline {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: #7864ff;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }
  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }
  .search-box {
    position: relative;
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
  }
  .search-box input {
    flex: 1;
    background: rgba(120,80,255,0.08);
    border: 1px solid rgba(120,80,255,0.4);
    border-right: none;
    color: #e0e0ff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 1rem 1.2rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  }
  .search-box input:focus {
    border-color: rgba(120,80,255,0.9);
    box-shadow: inset 0 0 20px rgba(120,80,255,0.1);
  }
  .search-box input::placeholder { color: rgba(120,80,255,0.4); }
  .go-btn {
    background: #7850ff;
    border: 1px solid #9870ff;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 1rem 1.5rem;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .go-btn:hover {
    background: #9870ff;
    box-shadow: 0 0 20px rgba(120,80,255,0.5);
  }
  .go-btn:active { transform: scale(0.97); }
  .quick-links {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .quick-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(120,80,255,0.2);
    color: rgba(200,200,255,0.7);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .quick-btn:hover {
    border-color: rgba(120,80,255,0.6);
    color: #fff;
    background: rgba(120,80,255,0.1);
  }
  .status-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    font-size: 0.65rem;
    color: rgba(120,80,255,0.6);
    letter-spacing: 0.1em;
    border-top: 1px solid rgba(120,80,255,0.1);
    padding-top: 1rem;
  }
  .status-item { display: flex; align-items: center; gap: 0.4rem; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #50ff80;
    box-shadow: 0 0 6px #50ff80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .corner {
    position: fixed;
    width: 40px; height: 40px;
    z-index: 2;
    opacity: 0.3;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 2px solid #7850ff; border-left: 2px solid #7850ff; }
  .corner-tr { top: 20px; right: 20px; border-top: 2px solid #7850ff; border-right: 2px solid #7850ff; }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 2px solid #7850ff; border-left: 2px solid #7850ff; }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 2px solid #7850ff; border-right: 2px solid #7850ff; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="container">
  <div class="logo">VOID</div>
  <div class="tagline">// anonymous proxy interface v1.0 //</div>

  <div class="search-box">
    <input type="text" id="urlInput" placeholder="enter url or search query..." autocomplete="off" spellcheck="false" />
    <button class="go-btn" onclick="navigate()">LAUNCH</button>
  </div>

  <div class="quick-links">
    <button class="quick-btn" onclick="quick('https://www.youtube.com')">▶ YouTube</button>
    <button class="quick-btn" onclick="quick('https://www.google.com')">◈ Google</button>
    <button class="quick-btn" onclick="quick('https://discord.com')">◉ Discord</button>
    <button class="quick-btn" onclick="quick('https://www.reddit.com')">◆ Reddit</button>
    <button class="quick-btn" onclick="quick('https://www.twitch.tv')">◈ Twitch</button>
    <button class="quick-btn" onclick="quick('https://www.spotify.com')">♫ Spotify</button>
  </div>

  <div class="status-bar">
    <div class="status-item"><div class="dot"></div> PROXY ONLINE</div>
    <div class="status-item">NODE: CLOUDFLARE</div>
    <div class="status-item">ENCRYPTION: ACTIVE</div>
  </div>
</div>

<script>
const BARE = 'wss://wisp.mercurywork.shop/';

function navigate() {
  let val = document.getElementById('urlInput').value.trim();
  if (!val) return;
  if (!val.startsWith('http')) {
    if (val.includes('.') && !val.includes(' ')) {
      val = 'https://' + val;
    } else {
      val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
    }
  }
  window.location.href = BARE + '?url=' + encodeURIComponent(val);
}

function quick(url) {
  window.location.href = BARE + '?url=' + encodeURIComponent(url);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') navigate();
});
</script>
</body>
</html>
